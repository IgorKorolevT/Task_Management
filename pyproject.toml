[project]
name = "task-management-api"
version = "1.0.0"
description = "REST API for task management system"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Task Management Team" }
]

dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.25.2",
    "passlib==1.7.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]


[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
]